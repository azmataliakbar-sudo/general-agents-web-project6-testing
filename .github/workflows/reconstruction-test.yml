name: Reconstruction Test
on:
  workflow_dispatch:   # manual trigger only

jobs:
  test-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reconstructed script on a fresh machine
        run: python reconstruction-test/monday_brief.py
      - name: Show proof file exists
        run: ls -la reconstruction-test/output/
        